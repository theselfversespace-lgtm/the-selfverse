<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Book an Appointment — THE SELFVERSE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#f5efe4,#e8dfd0);color:#29261f;min-height:100vh}
.container{width:92%;max-width:700px;margin:40px auto}
.card{background:rgba(255,255,255,.96);padding:35px;border-radius:20px;box-shadow:0 10px 35px rgba(0,0,0,.12)}
.brand{text-align:center;font-size:30px;font-weight:bold;letter-spacing:2px}
.subtitle{text-align:center;margin:10px 0 30px;color:#6c665d}
.form-group{margin-bottom:20px}
label{display:block;margin-bottom:8px;font-weight:bold;font-size:14px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid #d5cec2;border-radius:10px;font-size:15px;background:#fff;color:#29261f;outline:none}
input:focus,select:focus,textarea:focus{border-color:#7b6b4f;box-shadow:0 0 0 2px rgba(123,107,79,.12)}
textarea{min-height:120px;resize:vertical}
.time-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.time-btn{padding:12px 8px;border:1px solid #cfc5b5;background:#faf7f1;border-radius:9px;cursor:pointer;font-size:14px}
.time-btn.selected{background:#29261f;color:#fff;border-color:#29261f}.time-btn:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}.time-btn.booked{background:#f5e5e5;color:#873b3b;border-color:#e2caca}
.submit-btn{width:100%;padding:15px;border:0;border-radius:10px;background:#29261f;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
#message{margin-top:20px;padding:13px;border-radius:9px;display:none;text-align:center;font-size:14px}
.success{display:block!important;background:#e5f4e8;color:#216b32}
.error{display:block!important;background:#f9e1e1;color:#9b2929}
.back-link{display:block;text-align:center;margin-top:20px;color:#625744;text-decoration:none;font-size:14px}
@media(max-width:600px){.card{padding:25px 18px}.brand{font-size:25px}.time-buttons{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container"><div class="card">
<div class="brand">THE SELFVERSE</div>
<div class="subtitle">Book Your Counselling Appointment</div>

<form id="appointmentForm">
<div class="form-group">
<label for="name">Full Name</label>
<input id="name" type="text" placeholder="Enter your full name" required>
</div>

<div class="form-group">
<label for="phone">Phone Number</label>
<input id="phone" type="tel" placeholder="Enter your phone number" required>
</div>

<div class="form-group">
<label for="email">Email ID</label>
<input id="email" type="email" placeholder="Enter your email" required>
</div>

<div class="form-group">
<label for="service">Counselling Type</label>
<select id="service" required>
<option value="">Select counselling type</option>
<option>Individual Counselling</option>
<option>Student Counselling</option>
<option>Relationship Counselling</option>
<option>Stress Management</option>
<option>Confidence Building</option>
<option>Career Guidance</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label for="appointmentDate">Appointment Date</label>
<input id="appointmentDate" type="date" required>
</div>

<div class="form-group">
<label>Appointment Time</label>
<div class="time-buttons" id="timeButtons">
<button type="button" class="time-btn" data-time="09:00 AM">09:00 AM – 10:00 AM</button>
<button type="button" class="time-btn" data-time="10:00 AM">10:00 AM – 11:00 AM</button>
<button type="button" class="time-btn" data-time="11:00 AM">11:00 AM – 12:00 PM</button>
<button type="button" class="time-btn" data-time="12:00 PM">12:00 PM – 01:00 PM</button>
<button type="button" class="time-btn" data-time="01:00 PM">01:00 PM – 02:00 PM</button>
<button type="button" class="time-btn" data-time="02:00 PM">02:00 PM – 03:00 PM</button>
<button type="button" class="time-btn" data-time="03:00 PM">03:00 PM – 04:00 PM</button>
<button type="button" class="time-btn" data-time="04:00 PM">04:00 PM – 05:00 PM</button>
<button type="button" class="time-btn" data-time="05:00 PM">05:00 PM – 06:00 PM</button>
<button type="button" class="time-btn" data-time="06:00 PM">06:00 PM – 07:00 PM</button>
</div>
<input type="hidden" id="appointmentTime" required>
</div>

<div class="form-group">
<label for="problem">Tell us briefly about what you would like support with</label>
<textarea id="problem" placeholder="Write your concern here..." required></textarea>
</div>

<button type="submit" class="submit-btn" id="submitBtn">Submit Appointment</button>
<div id="message"></div>
</form>

<a href="index.html" class="back-link">← Back to THE SELFVERSE</a>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getFirestore,collection,doc,runTransaction,getDoc} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBdWlsexJQ5AEPcwCgF9wNvyIDSVHWK0o",
authDomain:"the-selfverse-5f579.firebaseapp.com",
projectId:"the-selfverse-5f579",
storageBucket:"the-selfverse-5f579.firebasestorage.app",
messagingSenderId:"1023879103176",
appId:"1:1023879103176:web:1f5d7a157ada46d83bdbfd"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const dateInput=document.getElementById("appointmentDate");
function localDateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
dateInput.min=localDateKey(new Date());

const timeButtons=document.querySelectorAll(".time-btn");
const timeInput=document.getElementById("appointmentTime");
const message=document.getElementById("message");
const submitBtn=document.getElementById("submitBtn");
let availabilityLoading=false;

function to24Hour(value){
 const m=String(value).trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
 if(!m)return value;
 let h=Number(m[1]);const min=m[2],ap=m[3].toUpperCase();
 if(ap==="AM"&&h===12)h=0;if(ap==="PM"&&h!==12)h+=12;
 return String(h).padStart(2,"0")+":"+min;
}
function slotKey(date,time){return String(date)+"_"+to24Hour(time).replace(":","-");}
function slotIsPast(date,time){
 const start=new Date(date+"T"+to24Hour(time)+":00");
 return start.getTime()<=Date.now();
}
function setTimeSelection(button){
 if(button.disabled)return;
 timeButtons.forEach(b=>b.classList.remove("selected"));
 button.classList.add("selected");
 timeInput.value=button.dataset.time;
}
timeButtons.forEach(button=>button.addEventListener("click",()=>setTimeSelection(button)));

dateInput.addEventListener("change",()=>{timeInput.value="";timeButtons.forEach(b=>b.classList.remove("selected"));loadAvailability();});

async function loadAvailability(){
 const date=dateInput.value;
 if(!date)return;
 availabilityLoading=true;
 timeButtons.forEach(b=>{b.disabled=true;b.classList.remove("booked");b.title="Checking availability...";});
 try{
  await Promise.all(Array.from(timeButtons).map(async button=>{
   const time=button.dataset.time;
   const [bookedSnap,blockedSnap]=await Promise.all([
    getDoc(doc(db,"bookingSlots",slotKey(date,time))),
    getDoc(doc(db,"blockedSlots",slotKey(date,time)))
   ]);
   const unavailable=bookedSnap.exists||blockedSnap.exists||slotIsPast(date,time);
   button.disabled=unavailable;
   button.classList.toggle("booked",unavailable);
   button.title=bookedSnap.exists?"Booked":blockedSnap.exists?"Unavailable":slotIsPast(date,time)?"Time has passed":"Available";
  }));
 }catch(error){
  console.error("Availability check error:",error);
  message.textContent="Could not check available times. Please refresh and try again.";
  message.className="error";
 }finally{availabilityLoading=false;}
}

const form=document.getElementById("appointmentForm");
form.addEventListener("submit",async e=>{
 e.preventDefault();
 message.className="";message.style.display="none";
 if(availabilityLoading){message.textContent="Please wait while available times are checked.";message.className="error";return;}
 if(!timeInput.value){message.textContent="Please select an available one-hour appointment time.";message.className="error";return;}
 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const email=document.getElementById("email").value.trim();
 const service=document.getElementById("service").value;
 const appointmentDate=dateInput.value;
 const appointmentTime=timeInput.value;
 const problem=document.getElementById("problem").value.trim();
 if(slotIsPast(appointmentDate,appointmentTime)){message.textContent="That time has already passed. Please choose another slot.";message.className="error";await loadAvailability();return;}
 submitBtn.disabled=true;submitBtn.textContent="Submitting...";
 try{
  const appointmentRef=doc(collection(db,"appointments"));
  const slotRef=doc(db,"bookingSlots",slotKey(appointmentDate,appointmentTime));
  const statusRef=doc(db,"appointmentStatus",appointmentRef.id);
  await runTransaction(db,async tx=>{
   const slotSnap=await tx.get(slotRef);
   const blockedRef=doc(db,"blockedSlots",slotKey(appointmentDate,appointmentTime));
   const blockedSnap=await tx.get(blockedRef);
   if(slotSnap.exists||blockedSnap.exists)throw new Error("SLOT_ALREADY_BOOKED");
   tx.set(appointmentRef,{name,phone,email,service,appointmentDate,appointmentTime,problem,status:"Pending",createdAt:new Date().toISOString()});
   tx.set(slotRef,{appointmentId:appointmentRef.id,appointmentDate,appointmentTime,status:"Booked",createdAt:new Date().toISOString()});
   tx.set(statusRef,{appointmentId:appointmentRef.id,appointmentDate,appointmentTime,service,status:"Pending"});
  });
  message.innerHTML="Your appointment has been submitted successfully.<br><br><strong>Your Appointment ID:</strong><br><span style='font-size:18px;letter-spacing:1px'>"+appointmentRef.id+"</span><br><br><strong>Booked time:</strong> "+appointmentTime+" – one hour<br><br>Please save this ID to check your appointment status.";
  message.className="success";form.reset();timeButtons.forEach(b=>{b.classList.remove("selected");b.disabled=false;b.classList.remove("booked");});timeInput.value="";dateInput.min=localDateKey(new Date());
  await loadAvailability();
 }catch(error){
  console.error(error);
  if(error&&error.message==="SLOT_ALREADY_BOOKED"){
   message.textContent="Sorry, that time was just booked by someone else. Please choose another available slot.";
   message.className="error";
   await loadAvailability();
  }else{
   message.textContent="Unable to submit the appointment. Please try again.";message.className="error";
  }
 }finally{submitBtn.disabled=false;submitBtn.textContent="Submit Appointment";}
});

loadAvailability();
</script>
</body>
</html>
