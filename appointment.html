<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a Session | THE SELFVERSE</title>
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#24221e;--muted:#69645b;--green:#365847;--gold:#a9803f;--line:#ded5c4;--ok:#e8f1e9;--bad:#f7e7e7;--blocked:#eee9df}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7f3ea,#eef3ec);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6}.wrap{width:min(1050px,92%);margin:auto}.top{padding:34px 0 12px}.brand{font:700 28px Georgia,serif;letter-spacing:1px;color:var(--green)}.brand span{color:var(--gold)}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(34px,5vw,58px);line-height:1.05;margin:22px 0 12px}.lead{color:var(--muted);max-width:700px}.card{background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 16px 45px rgba(54,88,71,.08);margin:28px 0}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:120px;resize:vertical}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.slot{border:1px solid var(--line);background:#fff;padding:14px;border-radius:14px;cursor:pointer;text-align:center;font-weight:700;transition:.2s}.slot:hover{transform:translateY(-2px)}.slot.selected{border-color:var(--green);box-shadow:0 0 0 3px rgba(54,88,71,.12)}.slot.booked,.slot.blocked{cursor:not-allowed;transform:none}.slot.booked{background:var(--bad);color:#8b3d3d}.slot.blocked{background:var(--blocked);color:#777}.slot.available{background:var(--ok);color:#31563e}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0;color:var(--muted);font-size:14px}.legend span{padding:6px 10px;border-radius:20px}.legend .a{background:var(--ok)}.legend .b{background:var(--bad)}.legend .c{background:var(--blocked)}button.submit{margin-top:22px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--green);color:#fff;font-size:17px;font-weight:700;cursor:pointer}.notice{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f5f0e7;color:var(--muted);display:none}.success{background:var(--ok);color:#31563e}.error{background:var(--bad);color:#8b3d3d}a{color:var(--green);font-weight:700;text-decoration:none}.small{font-size:13px;color:var(--muted)}@media(max-width:700px){.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.slots{grid-template-columns:1fr 1fr}.card{padding:20px}}@media(max-width:430px){.slots{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap top"><div class="brand">THE <span>SELFVERSE</span></div><h1>Book a Session</h1><p class="lead">Choose a date and an available one-hour session. Booked and counsellor-blocked times cannot be selected.</p></div>
<div class="wrap">
<form id="appointmentForm" class="card">
<div class="field-grid">
<div class="field"><label for="name">Name</label><input id="name" required></div>
<div class="field"><label for="phone">Phone</label><input id="phone" required inputmode="tel"></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" required></div>
<div class="field"><label for="service">Counselling Type</label><select id="service" required><option value="">Select a service</option><option>Individual Counselling</option><option>Student Counselling</option><option>Relationship Counselling</option><option>Stress Management</option><option>Confidence Building</option><option>Career Guidance</option><option>Other</option></select></div>
<div class="field full"><label for="date">Appointment Date</label><input id="date" type="date" required></div>
<div class="field full"><label>One-hour appointment time</label><div class="legend"><span class="a">🟢 Available</span><span class="b">🔴 Booked</span><span class="c">⚫ Blocked by counsellor</span></div><div id="slots" class="slots"></div><input id="time" type="hidden" required></div>
<div class="field full"><label for="problem">What would you like support with?</label><textarea id="problem" required></textarea></div>
</div>
<button class="submit" id="submitBtn">Book Appointment</button>
<div id="notice" class="notice"></div>
<p class="small">Working hours: 9:00 AM – 7:00 PM. Each appointment is one hour.</p>
</form>
<p><a href="index.html">← Back to THE SELFVERSE</a></p>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,runTransaction,serverTimestamp,collection} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBdWlsexJQ5AEPcwCgFq9wNvyIDSVHWK0o",authDomain:"the-selfverse-5f579.firebaseapp.com",projectId:"the-selfverse-5f579",storageBucket:"the-selfverse-5f579.firebasestorage.app",messagingSenderId:"1023879103176",appId:"1:1023879103176:web:1f5d7a157ada46d83bdbfd"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const TIMES=[
 {key:"09:00",label:"9:00 AM – 10:00 AM"},{key:"10:00",label:"10:00 AM – 11:00 AM"},{key:"11:00",label:"11:00 AM – 12:00 PM"},{key:"12:00",label:"12:00 PM – 1:00 PM"},{key:"13:00",label:"1:00 PM – 2:00 PM"},{key:"14:00",label:"2:00 PM – 3:00 PM"},{key:"15:00",label:"3:00 PM – 4:00 PM"},{key:"16:00",label:"4:00 PM – 5:00 PM"},{key:"17:00",label:"5:00 PM – 6:00 PM"},{key:"18:00",label:"6:00 PM – 7:00 PM"}
];
const dateEl=document.getElementById('date'),slotsEl=document.getElementById('slots'),timeEl=document.getElementById('time'),notice=document.getElementById('notice'),form=document.getElementById('appointmentForm'),submitBtn=document.getElementById('submitBtn');
const localToday=new Date(); localToday.setMinutes(localToday.getMinutes()-localToday.getTimezoneOffset()); dateEl.min=localToday.toISOString().slice(0,10); dateEl.value=dateEl.min;
function slotId(date,key){return `${date}_${key}`}
function showNotice(msg,type=''){notice.textContent=msg;notice.className='notice '+type;notice.style.display='block'}
function hideNotice(){notice.style.display='none'}
function escape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function ensureSlots(date){
  for(const t of TIMES){
    const ref=doc(db,'bookingSlots',slotId(date,t.key));
    const snap=await getDoc(ref);
    if(!snap.exists()) await setDoc(ref,{date,time:t.key,timeLabel:t.label,status:'available',updatedAt:serverTimestamp()});
  }
}
async function loadSlots(){
 const date=dateEl.value; if(!date)return; hideNotice(); timeEl.value='';
 slotsEl.innerHTML='<p class="small">Loading available times...</p>';
 try{await ensureSlots(date);const snaps=await Promise.all(TIMES.map(t=>getDoc(doc(db,'bookingSlots',slotId(date,t.key)))));slotsEl.innerHTML='';snaps.forEach((snap,i)=>{const t=TIMES[i],d=snap.data()||{},status=d.status||'available';const b=document.createElement('button');b.type='button';b.className='slot '+status;b.dataset.time=t.key;b.innerHTML=status==='available'?`🟢 ${escape(t.label)}`:status==='booked'?`🔴 ${escape(t.label)}<br><small>Booked</small>`:`⚫ ${escape(t.label)}<br><small>Unavailable</small>`;if(status==='available'){b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');timeEl.value=t.key}}else b.disabled=true;slotsEl.appendChild(b)});}catch(e){console.error(e);showNotice('Could not load appointment times. Please try again.','error')}
}
dateEl.addEventListener('change',loadSlots);loadSlots();
form.addEventListener('submit',async e=>{e.preventDefault();hideNotice();const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim(),service=document.getElementById('service').value,date=dateEl.value,time=timeEl.value,problem=document.getElementById('problem').value.trim();if(!time){showNotice('Please select an available one-hour time slot.','error');return}submitBtn.disabled=true;submitBtn.textContent='Booking...';try{
 const slotRef=doc(db,'bookingSlots',slotId(date,time));let appointmentId='';
 await runTransaction(db,async tx=>{const slotSnap=await tx.get(slotRef);if(!slotSnap.exists()||slotSnap.data().status!=='available')throw new Error('SLOT_TAKEN');const appointmentRef=doc(collection(db,'appointments'));appointmentId=appointmentRef.id;const label=TIMES.find(x=>x.key===time).label;tx.set(appointmentRef,{name,phone,email,problem,service,appointmentDate:date,appointmentTime:label,appointmentTimeKey:time,status:'Pending',createdAt:serverTimestamp()});tx.update(slotRef,{status:'booked',appointmentId,bookedByName:name,updatedAt:serverTimestamp()});const publicRef=doc(db,'appointmentStatus',appointmentId);tx.set(publicRef,{appointmentId,appointmentDate:date,appointmentTime:label,service,status:'Pending'});});
 form.reset();dateEl.min=localToday.toISOString().slice(0,10);dateEl.value=date;await loadSlots();showNotice(`Appointment submitted successfully. Your Appointment ID is ${appointmentId}. Save this ID to check your status.`,'success');
 }catch(err){console.error(err);if(err.message==='SLOT_TAKEN'){await loadSlots();showNotice('That time was just booked or blocked. Please choose another available time.','error')}else showNotice('Could not submit the appointment. Please try again.','error')}finally{submitBtn.disabled=false;submitBtn.textContent='Book Appointment'}});
</script>
</body></html>
