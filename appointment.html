<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book an Appointment — THE SELFVERSE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5efe4, #e8dfd0);
      color: #29261f;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 40px auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .brand {
      text-align: center;
      margin-bottom: 10px;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 30px;
      color: #6c665d;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d5cec2;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: #29261f;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #7b6b4f;
      box-shadow: 0 0 0 2px rgba(123,107,79,0.12);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .time-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .time-btn {
      padding: 12px 8px;
      border: 1px solid #cfc5b5;
      background: #faf7f1;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .time-btn:hover {
      background: #eee6d9;
    }

    .time-btn.selected {
      background: #29261f;
      color: white;
      border-color: #29261f;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #29261f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #4a443a;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      padding: 13px;
      border-radius: 9px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .success {
      display: block !important;
      background: #e5f4e8;
      color: #216b32;
    }

    .error {
      display: block !important;
      background: #f9e1e1;
      color: #9b2929;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #625744;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .container {
        width: 95%;
        margin: 20px auto;
      }

      .card {
        padding: 25px 18px;
      }

      .brand {
        font-size: 25px;
      }

      .time-buttons {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="brand">THE SELFVERSE</div>

      <div class="subtitle">
        Book Your Counselling Appointment
      </div>

      <form id="appointmentForm">

        <!-- NAME -->
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
          >
        </div>

        <!-- PHONE -->
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
          >
        </div>

        <!-- EMAIL -->
        <div class="form-group">
          <label for="email">Email ID</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <!-- COUNSELLING TYPE -->
        <div class="form-group">
          <label for="service">Counselling Type</label>

          <select id="service" required>
            <option value="">Select counselling type</option>
            <option value="Individual Counselling">
              Individual Counselling
            </option>
            <option value="Student Counselling">
              Student Counselling
            </option>
            <option value="Relationship Counselling">
              Relationship Counselling
            </option>
            <option value="Stress Management">
              Stress Management
            </option>
            <option value="Confidence Building">
              Confidence Building
            </option>
            <option value="Career Guidance">
              Career Guidance
            </option>
            <option value="Other">
              Other
            </option>
          </select>
        </div>

        <!-- DATE -->
        <div class="form-group">
          <label for="appointmentDate">Appointment Date</label>

          <input
            type="date"
            id="appointmentDate"
            required
          >
        </div>

        <!-- TIME -->
        <div class="form-group">

          <label>Appointment Time</label>

          <div class="time-buttons" id="timeButtons">

            <button type="button" class="time-btn" data-time="09:00 AM">
              09:00 AM
            </button>

            <button type="button" class="time-btn" data-time="09:30 AM">
              09:30 AM
            </button>

            <button type="button" class="time-btn" data-time="10:00 AM">
              10:00 AM
            </button>

            <button type="button" class="time-btn" data-time="10:30 AM">
              10:30 AM
            </button>

            <button type="button" class="time-btn" data-time="11:00 AM">
              11:00 AM
            </button>

            <button type="button" class="time-btn" data-time="11:30 AM">
              11:30 AM
            </button>

            <button type="button" class="time-btn" data-time="12:00 PM">
              12:00 PM
            </button>

            <button type="button" class="time-btn" data-time="12:30 PM">
              12:30 PM
            </button>

            <button type="button" class="time-btn" data-time="01:00 PM">
              01:00 PM
            </button>

            <button type="button" class="time-btn" data-time="01:30 PM">
              01:30 PM
            </button>

            <button type="button" class="time-btn" data-time="02:00 PM">
              02:00 PM
            </button>

            <button type="button" class="time-btn" data-time="02:30 PM">
              02:30 PM
            </button>

            <button type="button" class="time-btn" data-time="03:00 PM">
              03:00 PM
            </button>

            <button type="button" class="time-btn" data-time="03:30 PM">
              03:30 PM
            </button>

            <button type="button" class="time-btn" data-time="04:00 PM">
              04:00 PM
            </button>

            <button type="button" class="time-btn" data-time="04:30 PM">
              04:30 PM
            </button>

            <button type="button" class="time-btn" data-time="05:00 PM">
              05:00 PM
            </button>

            <button type="button" class="time-btn" data-time="05:30 PM">
              05:30 PM
            </button>

            <button type="button" class="time-btn" data-time="06:00 PM">
              06:00 PM
            </button>

            <button type="button" class="time-btn" data-time="06:30 PM">
              06:30 PM
            </button>

            <button type="button" class="time-btn" data-time="07:00 PM">
              07:00 PM
            </button>

          </div>

          <input
            type="hidden"
            id="appointmentTime"
            required
          >

        </div>

        <!-- PROBLEM -->
        <div class="form-group">

          <label for="problem">
            Tell us briefly about what you would like support with
          </label>

          <textarea
            id="problem"
            placeholder="Write your concern here..."
            required
          ></textarea>

        </div>

        <!-- SUBMIT -->
        <button
          type="submit"
          class="submit-btn"
          id="submitBtn"
        >
          Submit Appointment
        </button>

        <div id="message"></div>

      </form>

      <a href="index.html" class="back-link">
        ← Back to THE SELFVERSE
      </a>

    </div>
  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBdWlsexJ5AEPcwCgF9wNvyIDSVHWK0o",
      authDomain: "the-selfverse-5f579.firebaseapp.com",
      projectId: "the-selfverse-5f579",
      storageBucket: "the-selfverse-5f579.firebasestorage.app",
      messagingSenderId: "1023879103176",
      appId: "1:1023879103176:web:1f5d7a157ada46d83bdbfd"
    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    // DATE MINIMUM = TODAY
    const dateInput =
      document.getElementById("appointmentDate");

    const today =
      new Date().toISOString().split("T")[0];

    dateInput.min = today;


    // TIME SELECTION
    const timeButtons =
      document.querySelectorAll(".time-btn");

    const timeInput =
      document.getElementById("appointmentTime");


    timeButtons.forEach(button => {

      button.addEventListener("click", () => {

        timeButtons.forEach(btn => {
          btn.classList.remove("selected");
        });

        button.classList.add("selected");

        timeInput.value =
          button.dataset.time;

      });

    });


    // FORM SUBMISSION
    const form =
      document.getElementById("appointmentForm");

    const message =
      document.getElementById("message");

    const submitBtn =
      document.getElementById("submitBtn");


    form.addEventListener("submit", async (event) => {

      event.preventDefault();


      message.className = "";
      message.style.display = "none";
      message.textContent = "";


      if (!timeInput.value) {

        message.textContent =
          "Please select an appointment time.";

        message.className = "error";

        return;
      }


      submitBtn.disabled = true;

      submitBtn.textContent =
        "Submitting...";


      const name =
        document.getElementById("name").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const service =
        document.getElementById("service").value;

      const appointmentDate =
        dateInput.value;

      const appointmentTime =
        timeInput.value;

      const problem =
        document.getElementById("problem").value.trim();


      try {

        await addDoc(
          collection(db, "appointments"),
          {

            name: name,

            phone: phone,

            email: email,

            service: service,

            appointmentDate: appointmentDate,

            appointmentTime: appointmentTime,

            problem: problem,

            status: "Pending",

            createdAt:
              new Date().toISOString()

          }
        );


        message.textContent =
          "Your appointment has been submitted successfully.";

        message.className = "success";


        form.reset();


        timeButtons.forEach(btn => {
          btn.classList.remove("selected");
        });

        timeInput.value = "";


      } catch (error) {

        console.error(error);

        message.textContent =
          "Unable to submit the appointment. Please try again.";

        message.className = "error";

      }


      submitBtn.disabled = false;

      submitBtn.textContent =
        "Submit Appointment";

    });

  </script>

</body>
</html>
