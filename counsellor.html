<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE SELFVERSE — Counsellor Portal</title>
<style>
:root{--cream:#f7f2e8;--paper:#fffdf8;--ink:#29251f;--muted:#756f63;--green:#3f5b4b;--red:#a94747;--line:#e4dac8}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}
.wrap{width:min(1000px,calc(100% - 28px));margin:auto}
header{padding:25px 0;display:flex;justify-content:space-between;align-items:center}
.brand{font:bold 24px Georgia,serif}.brand span{color:#b99652}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;margin:20px 0;box-shadow:0 12px 35px rgba(40,30,15,.06)}
h1,h2{font-family:Georgia,serif}
label{display:block}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin:7px 0 14px;font-size:15px}
button{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700}
.primary{background:var(--green);color:white}.secondary{background:#eee7da;color:var(--ink)}
.hidden{display:none!important}.error{color:var(--red);min-height:22px}
.message{padding:12px;border-radius:10px;background:#f4eee3;color:var(--muted);margin-top:14px}
.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.status-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.status-buttons button{border:1px solid var(--line);background:white}
.status-label{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:8px 13px;border-radius:999px}
.green{background:#e8f1e9;color:#31563e}.red{background:#f5e5e5;color:#873b3b}.orange{background:#f7ead8;color:#925c18}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.green .dot{background:#3b8b52}.red .dot{background:#b64a4a}.orange .dot{background:#d58a2c}
.appointment{border-top:1px solid var(--line);padding:18px 0}
.appointment:first-child{border-top:0}.appointment h3{margin:0 0 8px}
.appointment p{margin:5px 0;color:var(--muted)}
.small{color:var(--muted);font-size:13px}
@media(max-width:650px){.panel{padding:18px}.topbar{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand">THE <span>SELFVERSE</span></div>
<button id="logoutBtn" class="secondary hidden">Log out</button>
</header>

<section id="loginPanel" class="panel">
<h1>Counsellor Login</h1>
<p class="small">Sign in with the Firebase counsellor account.</p>
<label for="email">Email</label>
<input id="email" type="email" autocomplete="username" placeholder="Counsellor email">
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Password">
<button id="loginBtn" class="primary" type="button">Sign In</button>
<p id="loginError" class="error"></p>
<div id="loginMessage" class="message hidden"></div>
</section>

<section id="dashboard" class="hidden">
<div class="panel">
<div class="topbar">
<div><h1>Private Counsellor Portal</h1><p class="small">View appointments and manage availability.</p></div>
<span id="userEmail" class="small"></span>
</div>
</div>

<div class="panel">
<h2>My Availability</h2>
<div id="currentStatus" class="status-label green"><span class="dot"></span>🟢 Active</div>
<div class="status-buttons">
<button type="button" onclick="setStatus('active')">🟢 Active</button>
<button type="button" onclick="setStatus('inactive')">🔴 Inactive</button>
<button type="button" onclick="setStatus('counselling')">🟠 In Counselling</button>
</div>
<p class="small">This version stores availability on this device.</p>
</div>

<div class="panel">
<div class="topbar"><h2>Appointments</h2><button id="refreshBtn" class="secondary" type="button">Refresh</button></div>
<div id="appointments"><p class="small">Loading appointments...</p></div>
</div>
</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBdWlsexJQ5AEPcwCgFq9wNvyIDSVHWK0o",
  authDomain: "the-selfverse-5f579.firebaseapp.com",
  projectId: "the-selfverse-5f579",
  storageBucket: "the-selfverse-5f579.firebasestorage.app",
  messagingSenderId: "1023879103176",
  appId: "1:1023879103176:web:1f5d7a157ada46d83bdbfd"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const loginMessage = document.getElementById("loginMessage");
const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");
const logoutBtn = document.getElementById("logoutBtn");
const appointmentsEl = document.getElementById("appointments");

loginBtn.addEventListener("click", async function () {
  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in...";
  loginError.textContent = "";
  loginMessage.classList.add("hidden");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    loginError.textContent = "Please enter both email and password.";
    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    console.error("Firebase sign-in error:", error);
    loginError.textContent = "Sign in failed: " + getFriendlyError(error);
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Sign In";
  }
});

function getFriendlyError(error) {
  const code = error && error.code ? error.code : "";
  if (code.includes("invalid-credential")) return "Incorrect email or password.";
  if (code.includes("invalid-email")) return "The email address is not valid.";
  if (code.includes("user-disabled")) return "This Firebase user account is disabled.";
  if (code.includes("too-many-requests")) return "Too many attempts. Please wait and try again.";
  if (code.includes("operation-not-allowed")) return "Email/Password sign-in is not enabled in Firebase Authentication.";
  if (code.includes("network-request-failed")) return "Network error. Check your internet connection.";
  return error && error.message ? error.message : "Please check the Firebase account and try again.";
}

logoutBtn.addEventListener("click", () => signOut(auth));
document.getElementById("refreshBtn").addEventListener("click", loadAppointments);

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

async function loadAppointments() {
  appointmentsEl.innerHTML = "<p class='small'>Loading appointments...</p>";
  try {
    const q = query(collection(db, "appointments"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);

    if (snap.empty) {
      appointmentsEl.innerHTML = "<p class='small'>No appointments yet.</p>";
      return;
    }

    appointmentsEl.innerHTML = "";
    snap.forEach(doc => {
      const a = doc.data();
      const item = document.createElement("div");
      item.className = "appointment";
      item.innerHTML =
        "<h3>" + escapeHtml(a.name) + "</h3>" +
        "<p><strong>Phone:</strong> " + escapeHtml(a.phone) + "</p>" +
        "<p><strong>Email:</strong> " + escapeHtml(a.email) + "</p>" +
        "<p><strong>Concern:</strong> " + escapeHtml(a.problem) + "</p>" +
        "<p class='small'><strong>Submitted:</strong> " + escapeHtml(a.createdAt) + "</p>";
      appointmentsEl.appendChild(item);
    });
  } catch (error) {
    console.error("Firestore error:", error);
    appointmentsEl.innerHTML =
      "<p class='error'>Login worked, but appointments could not be loaded. Check your Firestore rules.</p>";
  }
}

const statusMap = {
  active:{text:"🟢 Active", cls:"green"},
  inactive:{text:"🔴 Inactive", cls:"red"},
  counselling:{text:"🟠 In Counselling", cls:"orange"}
};

window.setStatus = function(status) {
  localStorage.setItem("selfverseCounsellorStatus", status);
  renderStatus();
};

function renderStatus() {
  const status = statusMap[localStorage.getItem("selfverseCounsellorStatus") || "active"];
  const el = document.getElementById("currentStatus");
  el.className = "status-label " + status.cls;
  el.innerHTML = '<span class="dot"></span>' + status.text;
}
renderStatus();

onAuthStateChanged(auth, async user => {
  if (user) {
    loginPanel.classList.add("hidden");
    dashboard.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");
    document.getElementById("userEmail").textContent = user.email || "Signed in";
    await loadAppointments();
  } else {
    loginPanel.classList.remove("hidden");
    dashboard.classList.add("hidden");
    logoutBtn.classList.add("hidden");
  }
});
</script>
</body>
</html>
