<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE SELFVERSE - Counsellor Portal</title>
<style>:root{--c:#f7f2e8;--p:#fffdf8;--i:#29251f;--m:#756f63;--gr:#3f5b4b;--r:#a94747;--o:#c17a25;--l:#e4dac8}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font:16px Arial,sans-serif}.wrap{width:min(1000px,calc(100% - 28px));margin:auto}header{padding:25px 0;display:flex;justify-content:space-between}.brand{font:bold 24px Georgia}.brand span{color:#b99652}.panel{background:var(--p);border:1px solid var(--l);border-radius:22px;padding:24px;margin:20px 0;box-shadow:0 12px 35px #281e0f0f}h1,h2{font-family:Georgia}input{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;margin:7px 0 14px}button{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:bold}.primary{background:var(--gr);color:#fff}.secondary{background:#eee7da}.hidden{display:none!important}.error{color:var(--r);min-height:22px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.status-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.status-buttons button{border:1px solid var(--l);background:#fff}.status-label{display:inline-flex;gap:8px;align-items:center;font-weight:bold;padding:8px 13px;border-radius:999px}.green{background:#e8f1e9;color:#31563e}.red{background:#f5e5e5;color:#873b3b}.orange{background:#f7ead8;color:#925c18}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.green .dot{background:#3b8b52}.red .dot{background:#b64a4a}.orange .dot{background:#d58a2c}.appointment{border-top:1px solid var(--l);padding:18px 0}.appointment:first-child{border-top:0}.appointment h3{margin:0 0 8px}.appointment p{margin:5px 0;color:var(--m)}.badge{background:#eee7da;padding:4px 9px;border-radius:8px;font-size:12px}.small{color:var(--m);font-size:13px}</style></head><body><div class="wrap"><header><div class="brand">THE <span>SELFVERSE</span></div><button id="logout" class="secondary hidden">Log out</button></header>
<section id="login" class="panel"><h1>Counsellor Login</h1><p class="small">Sign in with the Firebase counsellor account.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="signin" class="primary">Sign In</button><p id="err" class="error"></p></section>
<section id="dash" class="hidden"><div class="panel"><div class="topbar"><div><h1>Private Counsellor Portal</h1><p class="small">View appointments and manage availability.</p></div><span id="user" class="badge"></span></div></div>
<div class="panel"><h2>My Availability</h2><div id="status" class="status-label green"><span class="dot"></span>🟢 Active</div><div class="status-buttons"><button onclick="setStatus('active')">🟢 Active</button><button onclick="setStatus('inactive')">🔴 Inactive</button><button onclick="setStatus('counselling')">🟠 In Counselling</button></div><p class="small">Status is stored on this device in this version.</p></div>
<div class="panel"><div class="topbar"><h2>Appointments</h2><button id="refresh" class="secondary">Refresh</button></div><div id="apps"><p class="small">Loading...</p></div></div></section></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,collection,getDocs,query,orderBy}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBdWlsexJQ5AEPcwCgFq9wNvyIDSVHWK0o",authDomain:"the-selfverse-5f579.firebaseapp.com",projectId:"the-selfverse-5f579",storageBucket:"the-selfverse-5f579.firebasestorage.app",messagingSenderId:"1023879103176",appId:"1:1023879103176:web:1f5d7a157ada46d83bdbfd"},app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);$("signin").onclick=async()=>{ $("err").textContent="";try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("err").textContent="Login failed. Check your Firebase account details."}};
$("logout").onclick=()=>signOut(auth);$("refresh").onclick=load;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[c]))}
async function load(){ $("apps").innerHTML="<p class='small'>Loading appointments...</p>";try{const s=await getDocs(query(collection(db,"appointments"),orderBy("createdAt","desc")));if(s.empty){$("apps").innerHTML="<p class='small'>No appointments yet.</p>";return}$("apps").innerHTML="";s.forEach(d=>{let a=d.data(),x=document.createElement("div");x.className="appointment";x.innerHTML="<h3>"+esc(a.name)+"</h3><p><b>Phone:</b> "+esc(a.phone)+"</p><p><b>Email:</b> "+esc(a.email)+"</p><p><b>Concern:</b> "+esc(a.problem)+"</p><p class='small'><b>Submitted:</b> "+esc(a.createdAt)+"</p>";$("apps").appendChild(x)})}catch(e){$("apps").innerHTML="<p class='error'>Could not load appointments. Check Firestore rules and connection.</p>"}}
const sm={active:{t:"🟢 Active",c:"green"},inactive:{t:"🔴 Inactive",c:"red"},counselling:{t:"🟠 In Counselling",c:"orange"}};window.setStatus=s=>{localStorage.setItem("selfverseStatus",s);render()};function render(){let s=sm[localStorage.getItem("selfverseStatus")||"active"];$("status").className="status-label "+s.c;$("status").innerHTML='<span class="dot"></span>'+s.t}render();
onAuthStateChanged(auth,async u=>{if(u){$("login").classList.add("hidden");$("dash").classList.remove("hidden");$("logout").classList.remove("hidden");$("user").textContent=u.email||"Signed in";await load()}else{$("login").classList.remove("hidden");$("dash").classList.add("hidden");$("logout").classList.add("hidden")}})
</script></body></html>
